# Managed by Bruteforce-Group/github-governance: created once when missing, then yours to edit.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/mps"
      - "/rps"
      - "/sample-web-ui"
      - "/ui-toolkit"
      - "/ui-toolkit-angular"
      - "/ui-toolkit-react"
      - "/ui-toolkit/dist"
      - "/ui-toolkit/dist/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      npm-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      github-actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/mps"
      - "/mps-router"
      - "/pg"
      - "/rpc"
      - "/rpc-go"
      - "/rps"
      - "/sample-web-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      docker-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/mps-router"
      - "/rpc-go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      gomod-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      gomod-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
